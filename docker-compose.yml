services:
  web:
    build:
      context: .
      target: dev
    container_name: opentek-web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true # hot-reload fiable dans Docker
    command: npm run dev -- --host 0.0.0.0
